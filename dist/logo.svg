<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Ultra-vivid Crimson-to-Amber Luxury Gradient (#FF1A4B to #F59E0B) -->
    <linearGradient id="pgLuxuryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A4B" />
      <stop offset="45%" stop-color="#FF4D36" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Obsidian Carbon/Armor Shield Surface -->
    <linearGradient id="pgObsidian" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#161B26" />
      <stop offset="50%" stop-color="#0B0E14" />
      <stop offset="100%" stop-color="#05070A" />
    </linearGradient>

    <!-- Platinum & Optical Sensor Gold -->
    <linearGradient id="pgSensorGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="35%" stop-color="#FDE68A" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="pgPlatinum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="45%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Outer Cinematic Shield Glow -->
    <filter id="pgShieldGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#FF1A4B" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Dark Canvas Tile -->
  <rect width="512" height="512" rx="120" fill="#07090E" stroke="url(#pgLuxuryGrad)" stroke-width="3" stroke-opacity="0.25" />

  <!-- Outer Obsidian Shield with Ultra-vivid Crimson-to-Amber Contour -->
  <path d="M256,50 L416,115 C416,276 334,402 256,462 C178,402 96,276 96,115 Z"
        fill="url(#pgObsidian)"
        stroke="url(#pgLuxuryGrad)"
        stroke-width="10"
        stroke-linejoin="round"
        filter="url(#pgShieldGlow)" />

  <!-- Inner Bevel Shield Rim -->
  <path d="M256,76 L392,132 C392,266 324,374 256,426 C188,374 120,266 120,132 Z"
        fill="none"
        stroke="#FFFFFF"
        stroke-opacity="0.14"
        stroke-width="2.5" />

  <!-- 6-Blade Aperture Outer Lens Barrel Ring -->
  <circle cx="256" cy="246" r="96" fill="#040609" stroke="url(#pgLuxuryGrad)" stroke-width="4.5" stroke-opacity="0.8" />
  <circle cx="256" cy="246" r="88" fill="none" stroke="url(#pgPlatinum)" stroke-width="1.5" stroke-opacity="0.35" stroke-dasharray="6 4" />

  <!-- 6-Blade Aperture Iris Geometry (Rotated 60 deg each) -->
  <g transform="translate(256, 246)">
    <!-- Blade 1 -->
    <path d="M0,-84 L54,-24 L16,-38 Z" fill="url(#pgLuxuryGrad)" opacity="0.95" />
    <!-- Blade 2 -->
    <path d="M73,-42 L48,34 L21,8 Z" fill="url(#pgLuxuryGrad)" opacity="0.9" />
    <!-- Blade 3 -->
    <path d="M73,42 L-6,58 L6,25 Z" fill="url(#pgLuxuryGrad)" opacity="0.85" />
    <!-- Blade 4 -->
    <path d="M0,84 L-54,24 L-16,38 Z" fill="url(#pgLuxuryGrad)" opacity="0.95" />
    <!-- Blade 5 -->
    <path d="M-73,42 L-48,-34 L-21,-8 Z" fill="url(#pgLuxuryGrad)" opacity="0.9" />
    <!-- Blade 6 -->
    <path d="M-73,-42 L6,-58 L-6,-25 Z" fill="url(#pgLuxuryGrad)" opacity="0.85" />
  </g>

  <!-- Platinum / Gold Optical Sensor Core & Vault Lock -->
  <circle cx="256" cy="246" r="44" fill="#07090E" stroke="url(#pgSensorGold)" stroke-width="5" />
  <circle cx="256" cy="246" r="36" fill="none" stroke="url(#pgPlatinum)" stroke-width="1.5" stroke-opacity="0.75" />

  <!-- Optical Sensor Matrix / Lens Center -->
  <circle cx="256" cy="246" r="24" fill="url(#pgObsidian)" stroke="url(#pgLuxuryGrad)" stroke-width="2" />

  <!-- Vault Optical Sensor Lock Component -->
  <rect x="245" y="241" width="22" height="17" rx="4" fill="url(#pgSensorGold)" />
  <path d="M250,241 L250,233 C250,229.7 252.7,227 256,227 C259.3,227 262,229.7 262,233 L262,241"
        fill="none" stroke="url(#pgSensorGold)" stroke-width="3" stroke-linecap="round" />
  <circle cx="256" cy="248.5" r="2.2" fill="#090B10" />

  <!-- Optical Lens Glint Reflection -->
  <circle cx="234" cy="224" r="7" fill="#FFFFFF" opacity="0.8" />
  <circle cx="241" cy="231" r="3" fill="#FFFFFF" opacity="0.95" />
</svg>
