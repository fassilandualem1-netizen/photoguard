name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - mobile-client-app
    paths:
      - 'mobile-client/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches:
      - main
      - mobile-client-app
    paths:
      - 'mobile-client/**'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.6

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Build Android APKs (Release & Debug)
        run: ./gradlew :mobile-client:assembleRelease :mobile-client:assembleDebug --stacktrace

      - name: Upload APKs to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: photoguard-client-apks
          path: mobile-client/build/outputs/apk/**/*.apk
          retention-days: 14
