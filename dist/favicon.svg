<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563eb" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background rounded square matching app launcher -->
  <rect width="108" height="108" rx="26" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />
  
  <!-- Outer glowing shield -->
  <path d="M54,14 L82,26 L82,50 C82,68 66,80 54,86 C42,80 26,68 26,50 L26,26 Z" 
        fill="#ffffff" 
        filter="url(#glow)" />

  <!-- Inner shield core -->
  <path d="M54,18 L78,28.5 L78,49.5 C78,65 64,76 54,81.5 C44,76 30,65 30,49.5 L30,28.5 Z" 
        fill="url(#shieldGrad)" />

  <!-- Camera / Shutter aperture accent in lock -->
  <circle cx="54" cy="51" r="16" fill="#ffffff" opacity="0.15" />
  <circle cx="54" cy="51" r="11" fill="#0d47a1" />

  <!-- Keyhole / Center lens -->
  <circle cx="54" cy="49" r="3.5" fill="#60a5fa" />
  <path d="M52.5,50 L55.5,50 L56.5,56 L51.5,56 Z" fill="#60a5fa" />
</svg>
