name: Android Release APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - mobile-client-app
  pull_request:
    branches:
      - main
      - mobile-client-app

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK (< 5 MB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.6

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Restore Permanent Release Keystore
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > mobile-client/photoguard-release.keystore
            echo "✅ Permanent keystore restored from secret"
          else
            echo "ℹ️ Using repo keystore fallback"
          fi

      - name: Build Optimized Release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ github.workspace }}/mobile-client/photoguard-release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :mobile-client:assembleRelease --stacktrace

      - name: Verify & Display Release APK Size
        run: |
          echo "### 📱 PhotoGuard Release APK Successfully Built!" >> $GITHUB_STEP_SUMMARY
          ls -lh mobile-client/build/outputs/apk/release/
          for apk in mobile-client/build/outputs/apk/release/*.apk; do
            SIZE=$(ls -lh "$apk" | awk '{print $5}')
            echo "- File: **$(basename "$apk")** | Size: **$SIZE**" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: photoguard-release-apk
          path: mobile-client/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Publish GitHub Release with Direct APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.0.4
          name: "PhotoGuard Mobile App v1.0.4"
          body: |
            ### 📱 PhotoGuard Android Release APK v1.0.4
            Direct download link for your Android phone:
            - **Clean proofing**: 100% un-watermarked high-resolution previews
            - **Anti-piracy**: Android FLAG_SECURE screenshot protection
            - **Fast syncing**: Real-time client selections
          files: mobile-client/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
