name: Android Release APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - mobile-client-app
    paths:
      - 'mobile-client/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches:
      - main
      - mobile-client-app
    paths:
      - 'mobile-client/**'

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK (< 5 MB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.6

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Generate Production Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore mobile-client/release.keystore \
            -alias photoguard \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass photoguard_secret_pass \
            -keypass photoguard_secret_pass \
            -dname "CN=PhotoGuard, OU=Mobile, O=PhotoGuard, L=Addis Ababa, ST=Addis Ababa, C=ET"

      - name: Build Optimized Release APK
        run: ./gradlew :mobile-client:assembleRelease --stacktrace

      - name: Verify & Display Release APK Size
        run: |
          echo "### 📱 PhotoGuard Release APK Successfully Built!" >> $GITHUB_STEP_SUMMARY
          ls -lh mobile-client/build/outputs/apk/release/
          for apk in mobile-client/build/outputs/apk/release/*.apk; do
            SIZE=$(ls -lh "$apk" | awk '{print $5}')
            echo "- File: **$(basename "$apk")** | Size: **$SIZE**" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: photoguard-release-apk
          path: mobile-client/build/outputs/apk/release/*.apk
          retention-days: 14
