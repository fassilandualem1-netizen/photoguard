name: Build PhotoGuard APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Assemble Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: photoguard-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "PhotoGuard Client App v1.0.1 (Anti-Crash & Verified Release)"
          body: |
            ### 🛡️ PhotoGuard Client Android Application v1.0.1
            - **Crash-Proof PIN Input**: Fixed `BasicTextField` IME layout composition and focus handling.
            - **Zero-Error R8 Serialization**: Safe model reflection with guaranteed type preservation.
            - **Global Crash Guard**: `Thread.setDefaultUncaughtExceptionHandler` intercepts unhandled exceptions to prevent falling back to the phone's home screen.
            - **State Preservation**: `ActiveAlbumHolder` prevents null backstack states during navigation transitions.
            - **Anti-Piracy**: Hardened window security with `FLAG_SECURE` (Blocks screenshots & recording).
            - **RAM-Only Cache**: Volatile memory-only rendering with Coil (`diskCache(null)`).
            - **Collaborative Sync**: Smart 3s Redis Upstash polling & Single Submit Lock.
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Logs on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            app/build/reports/
            build/reports/
          retention-days: 7
